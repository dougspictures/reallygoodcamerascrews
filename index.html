<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Really Good Camera Screws</title>
  <style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: #000; }
.slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; animation: fade 12s infinite; }
.slide:nth-child(1) { background: linear-gradient(135deg, #1a1a1a, #3a3a3a); animation-delay: 0s; }
.slide:nth-child(2) { background: linear-gradient(135deg, #2b2b2b, #555555); animation-delay: 4s; }
.slide:nth-child(3) { background: linear-gradient(135deg, #111111, #444444); animation-delay: 8s; }
@keyframes fade { 0% { opacity: 0; } 8% { opacity: 1; } 33% { opacity: 1; } 41% { opacity: 0; } 100% { opacity: 0; } }
.overlay { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; text-align: center; padding: 24px; box-sizing: border-box; }
h1 { font-size: clamp(28px, 5vw, 56px); letter-spacing: 0.02em; margin: 0 0 12px; font-weight: 600; }
p { font-size: 16px; opacity: 0.7; margin: 0; }
</style>
  </head>
  <body>
  <div class="slide"></div>
  <div class="slide"></div>
  <div class="slide"></div>
  <div class="overlay">
  <h1>Really Good Camera Screws</h1>
  <p>Site live &mdash; photos loading soon.</p>
  </div>
  </body>
  </html>
